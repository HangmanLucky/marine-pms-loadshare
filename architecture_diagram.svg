<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Consolas, monospace">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14304f" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#08121f"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="680" fill="none" stroke="#7fb3f0" stroke-width="1.5"/>

  <text x="40" y="52" fill="#e6f0fc" font-size="22" font-weight="700" letter-spacing="1">AUTONOMOUS MARINE POWER MANAGEMENT SYSTEM (PMS)</text>
  <text x="40" y="76" fill="#9cc2fa" font-size="13">Intelligent Load-Shedding &amp; Blackout Recovery &#8212; Simplified Single-Line Diagram</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#7fb3f0" stroke-width="1"/>

  <!-- Gen1 -->
  <circle cx="150" cy="260" r="55" fill="none" stroke="#e6f0fc" stroke-width="1.6"/>
  <text x="150" y="255" fill="#e6f0fc" font-size="14" text-anchor="middle" font-weight="700">GEN1</text>
  <text x="150" y="273" fill="#9cc2fa" font-size="10" text-anchor="middle">DUTY, 2000kW</text>

  <line x1="205" y1="260" x2="260" y2="260" stroke="#e6f0fc" stroke-width="2"/>
  <rect x="260" y="248" width="30" height="24" fill="#35d0a0" stroke="#08121f" stroke-width="1"/>
  <text x="275" y="296" fill="#9cc2fa" font-size="9" text-anchor="middle">BKR1</text>
  <line x1="290" y1="260" x2="345" y2="260" stroke="#e6f0fc" stroke-width="2"/>

  <!-- Bus -->
  <line x1="345" y1="260" x2="855" y2="260" stroke="#4f8ef7" stroke-width="5"/>
  <text x="600" y="230" fill="#9cc2fa" font-size="12" text-anchor="middle">MAIN BUSBAR &#8212; 450V / 60Hz</text>

  <!-- Gen2 -->
  <line x1="855" y1="260" x2="910" y2="260" stroke="#e6f0fc" stroke-width="2"/>
  <rect x="910" y="248" width="30" height="24" fill="#556478" stroke="#08121f" stroke-width="1"/>
  <text x="925" y="296" fill="#9cc2fa" font-size="9" text-anchor="middle">BKR2</text>
  <line x1="940" y1="260" x2="995" y2="260" stroke="#e6f0fc" stroke-width="2"/>
  <circle cx="1050" cy="260" r="55" fill="none" stroke="#e6f0fc" stroke-width="1.6"/>
  <text x="1050" y="255" fill="#e6f0fc" font-size="14" text-anchor="middle" font-weight="700">GEN2</text>
  <text x="1050" y="273" fill="#9cc2fa" font-size="10" text-anchor="middle">STANDBY, 2000kW</text>

  <!-- Sync relay -->
  <rect x="740" y="140" width="150" height="50" fill="none" stroke="#f5a623" stroke-width="1.6"/>
  <text x="815" y="163" fill="#f5b95c" font-size="11" text-anchor="middle" font-weight="700">SYNC RELAY</text>
  <text x="815" y="178" fill="#9cc2fa" font-size="9" text-anchor="middle">Freq / Volt / Phase</text>
  <line x1="815" y1="190" x2="815" y2="248" stroke="#f5a623" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Emergency Gen -->
  <line x1="600" y1="260" x2="600" y2="330" stroke="#7fb3f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="500" y="330" width="200" height="60" fill="none" stroke="#e6f0fc" stroke-width="1.6"/>
  <text x="600" y="356" fill="#e6f0fc" font-size="12" text-anchor="middle" font-weight="700">EMERGENCY GENERATOR</text>
  <text x="600" y="374" fill="#9cc2fa" font-size="9" text-anchor="middle">SOLAS Ch.II-1 &#8212; 45s auto-start</text>

  <!-- Load groups -->
  <rect x="70" y="450" width="150" height="50" fill="none" stroke="#35d0a0" stroke-width="1.4"/>
  <text x="145" y="480" fill="#35d0a0" font-size="10" text-anchor="middle">ESSENTIAL LOADS (unsheddable)</text>
  <line x1="145" y1="450" x2="145" y2="400" stroke="#35d0a0" stroke-width="1.2"/>
  <line x1="145" y1="400" x2="345" y2="400" stroke="#35d0a0" stroke-width="1.2"/>
  <line x1="345" y1="400" x2="345" y2="260" stroke="#35d0a0" stroke-width="1.2" opacity="0"/>

  <rect x="260" y="450" width="150" height="50" fill="none" stroke="#f5a623" stroke-width="1.4"/>
  <text x="335" y="472" fill="#f5b95c" font-size="10" text-anchor="middle">STAGE 1</text>
  <text x="335" y="486" fill="#9cc2fa" font-size="9" text-anchor="middle">Galley / Laundry</text>

  <rect x="450" y="450" width="150" height="50" fill="none" stroke="#f5a623" stroke-width="1.4"/>
  <text x="525" y="472" fill="#f5b95c" font-size="10" text-anchor="middle">STAGE 2</text>
  <text x="525" y="486" fill="#9cc2fa" font-size="9" text-anchor="middle">Accommodation HVAC</text>

  <rect x="640" y="450" width="180" height="50" fill="none" stroke="#f5a623" stroke-width="1.4"/>
  <text x="730" y="472" fill="#f5b95c" font-size="10" text-anchor="middle">STAGE 3</text>
  <text x="730" y="486" fill="#9cc2fa" font-size="9" text-anchor="middle">Non-Essential Deck Machinery</text>

  <line x1="500" y1="425" x2="500" y2="260" stroke="#f5a623" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- PLC -->
  <rect x="900" y="440" width="220" height="110" fill="none" stroke="#4f8ef7" stroke-width="1.8"/>
  <text x="1010" y="474" fill="#7fb3f0" font-size="13" text-anchor="middle" font-weight="700">PMS CONTROLLER</text>
  <text x="1010" y="492" fill="#7fb3f0" font-size="11" text-anchor="middle">Siemens S7-1500</text>
  <text x="1010" y="508" fill="#7fb3f0" font-size="11" text-anchor="middle">FB_PMS_PowerManagement</text>
  <text x="1010" y="526" fill="#9cc2fa" font-size="9" text-anchor="middle">(CODESYS-portable ST) &#8212; UPS-backed</text>
  <line x1="1010" y1="440" x2="1010" y2="315" stroke="#4f8ef7" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1010" y1="315" x2="600" y2="315" stroke="#4f8ef7" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="315" x2="600" y2="260" stroke="#4f8ef7" stroke-width="1" stroke-dasharray="4 4" opacity="0"/>

  <!-- Title block -->
  <rect x="880" y="600" width="290" height="70" fill="none" stroke="#7fb3f0" stroke-width="1"/>
  <text x="895" y="618" fill="#e6f0fc" font-size="10">DWG NO: PMS-SLD-ARCH-001</text>
  <text x="895" y="633" fill="#e6f0fc" font-size="10">REV: A &#8212; SIMULATION / PORTFOLIO BUILD</text>
  <text x="895" y="648" fill="#e6f0fc" font-size="10">AUTHOR: SIPHO LUCKY SIBANDA</text>
  <text x="895" y="663" fill="#9cc2fa" font-size="9">NOT FOR SHIPBOARD DEPLOYMENT</text>
</svg>
